# PerformanceTestConfig.yaml
description: A YAML configuration file specifying the parameters for performance tests, such as the number of virtual users, test duration, ramp-up time, and other relevant settings.

# Configuration for performance tests

# General settings
test:
  name: "Banking Application Performance Test"
  description: "Parameters for performance tests including load, stress, and spike testing."

# Load test parameters
loadTest:
  virtualUsers: 100  # Number of virtual users
  testDuration: 15m  # Test duration (in minutes)
  rampUpTime: 5m     # Ramp-up time (in minutes)

# Stress test parameters
stressTest:
  initialUsers: 50   # Initial number of users
  incrementUsers: 10 # Users to be added at each step
  incrementDuration: 1m # Duration of each increment step
  maxUsers: 500      # Maximum number of users to determine breaking point

# Spike test parameters
spikeTest:
  baseLoadUsers: 20  # Base number of users
  spikeUsers: 200    # Number of users during a spike
  spikeDuration: 1m  # Duration of the spike (in minutes)
  recoveryDuration: 2m # Time to recover to base load (in minutes)

# Additional configurations
additionalConfigs:
  thinkTime: 3s       # Think time between requests (in seconds)
  endpoint: "http://localhost:8080/api" # Target endpoint for testing
